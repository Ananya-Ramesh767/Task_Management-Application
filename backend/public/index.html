<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="presentation">
            <rect x="10" y="10" width="28" height="28" rx="4"></rect>
            <path d="m17 25 5 5 10-11"></path>
          </svg>
        </div>
        <h1 class="auth-brand">Task Manager</h1>
        <div class="tabs" role="tablist">
          <button id="tabLogin" role="tab" aria-selected="true">Sign in</button>
          <button id="tabRegister" role="tab" aria-selected="false">Create account</button>
        </div>

        <h2 id="formTitle">Welcome back</h2>
        <p class="lead" id="formLead">Enter your details to open your task board.</p>

        <div class="notice" id="notice"></div>

        <form id="authForm" novalidate>
          <div class="field" id="nameField" hidden>
            <label for="name">Name</label>
            <input type="text" id="name" autocomplete="name" placeholder="Priya Raman" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <div class="input-with-icon">
              <span class="field-icon" aria-hidden="true">&#9993;</span>
              <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <span class="field-icon" aria-hidden="true">&#128274;</span>
              <input type="password" id="password" autocomplete="current-password" placeholder="At least 6 characters" required />
            </div>
          </div>
          <button class="btn btn-block" type="submit" id="submitBtn">Sign in</button>
        </form>
        <p class="auth-switch" id="authSwitch">Don't have an account? <button type="button" id="registerLink">Sign up</button></p>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
