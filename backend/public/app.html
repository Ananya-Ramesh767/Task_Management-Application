<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your tasks · Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Task Manager</div>
    <div class="live-dot" id="liveDot"><i></i><span>Connecting</span></div>
    <button class="btn btn-ghost btn-sm reminder-toggle" id="reminderBtn" type="button">Enable reminders</button>
    <div class="who" id="who"></div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 id="greeting">Your board</h1>
        <p id="summary">Loading tasks</p>
      </div>
      <button class="btn" id="newTaskBtn">Add task</button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title or notes" aria-label="Search tasks" />
      <select id="filterPriority" aria-label="Filter by priority">
        <option value="">All priorities</option>
        <option value="high">High priority</option>
        <option value="medium">Medium priority</option>
        <option value="low">Low priority</option>
      </select>
      <select id="sortBy" aria-label="Sort tasks">
        <option value="created">Newest first</option>
        <option value="due">Due date</option>
        <option value="priority">Priority</option>
      </select>
    </div>

    <div class="board" id="board"></div>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <div class="dialog-head"><h2 id="dialogTitle">Add task</h2></div>
      <div class="dialog-body">
        <div class="notice" id="dialogNotice"></div>
        <input type="hidden" id="taskId" />
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" maxlength="120" placeholder="Write the project brief" required />
        </div>
        <div class="field">
          <label for="description">Notes</label>
          <textarea id="description" placeholder="Anything you need to remember about this task"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label for="status">Stage</label>
            <select id="status">
              <option value="todo">To do</option>
              <option value="in-progress">In progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="dueDate">Due date</label>
          <input type="date" id="dueDate" />
        </div>
        <div class="field">
          <label for="reminderAt">Reminder <span class="label-hint">optional</span></label>
          <input type="datetime-local" id="reminderAt" />
          <small class="field-help">Get a nudge while this board is open.</small>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save task</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

<script src="https://task-management-application-nbw0.onrender.com/socket.io/socket.io.js"></script>  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
